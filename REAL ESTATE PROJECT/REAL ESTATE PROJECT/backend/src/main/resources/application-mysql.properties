# MySQL environment template. Do not put passwords in version control.
# This profile records the shared database contract used by all six modules.
# The current tested repositories are file-backed; enable this only after the
# repository adapter has been migrated and integration-tested against MySQL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:real_estate_portal}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:real_estate_app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
